openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Grocery catalog and discovery
  - name: orders
    description: Checkout and order placement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List grocery products
      description: Returns products with optional category and search filters.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List grocery categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /catalog/highlights:
    get:
      operationId: getCatalogHighlights
      tags: [catalog]
      summary: Get curated catalog highlights
      description: Returns lightweight merchandising data for the homepage.
      responses:
        "200":
          description: Curated homepage highlights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHighlights"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a grocery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, price, unit, image, accent, badge, featured]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        unit: { type: string }
        image: { type: string }
        accent: { type: string }
        badge: { type: ["string", "null"] }
        featured: { type: boolean }
    Category:
      type: object
      required: [id, name, count, icon]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer }
        icon: { type: string }
    CatalogHighlights:
      type: object
      required: [headline, subheadline, deliveryWindow, minimumOrder, freeDeliveryThreshold]
      properties:
        headline: { type: string }
        subheadline: { type: string }
        deliveryWindow: { type: string }
        minimumOrder: { type: number }
        freeDeliveryThreshold: { type: number }
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [items, customerName, phone, address, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        customerName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 8 }
        address: { type: string, minLength: 5 }
        paymentMethod:
          type: string
          enum: [cod, upi]
    Order:
      type: object
      required: [id, status, total, eta, paymentMethod]
      properties:
        id: { type: string }
        status: { type: string }
        total: { type: number }
        eta: { type: string }
        paymentMethod: { type: string }

